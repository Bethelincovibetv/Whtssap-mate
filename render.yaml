services:
  - type: web
    name: whtssap-mate
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22.23.2
      - key: GEMINI_API_KEY
        sync: false
      - key: DATA_DIR
        value: /tmp/session_auth
