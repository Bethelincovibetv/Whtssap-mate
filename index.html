<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Growth & Ad Network Engine</title>
    <meta name="description" content="Turnkey WhatsApp automation engine with 8-digit pairing code, automatic status viewing, smart emoji reactions, high-engagement story broadcasting, and viral community ad network." />
    <meta property="og:title" content="WhatsApp Growth & Ad Network Engine" />
    <meta property="og:description" content="Turnkey WhatsApp automation engine with 8-digit pairing code, automatic status viewing, smart emoji reactions, high-engagement story broadcasting, and viral community ad network." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b141a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WhatsAppEng" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <!-- Immediate Pre-Hydration Branded State (Eliminates Blank White Screen) -->
    <div id="root">
      <div id="app-preloader" style="min-height:100vh;background-color:#0b141a;display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:#e2e8f0;padding:1.5rem;box-sizing:border-box;">
        <div style="text-align:center;max-width:380px;width:100%;">
          <div style="width:64px;height:64px;margin:0 auto 18px;border-radius:20px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(16,185,129,0.15);">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
          </div>
          <h1 style="font-size:1.1875rem;font-weight:700;margin:0 0 6px;color:#ffffff;letter-spacing:-0.02em;">WhatsApp Growth & Automation</h1>
          <p style="font-size:0.8125rem;color:#94a3b8;margin:0 0 20px;line-height:1.5;">Starting multi-account engine and cloud network...</p>
          
          <div style="width:140px;height:4px;background:#202c33;border-radius:9999px;margin:0 auto 16px;overflow:hidden;position:relative;">
            <div style="position:absolute;height:100%;width:40%;background:#10b981;border-radius:9999px;animation:indet 1.3s infinite ease-in-out;"></div>
          </div>

          <div id="preloader-troubleshoot" style="display:none;margin-top:20px;padding-top:16px;border-top:1px solid #202c33;">
            <p style="font-size:0.75rem;color:#f59e0b;margin-bottom:10px;">Loading is taking longer than expected.</p>
            <button onclick="window.location.reload(true)" style="background:#10b981;color:#ffffff;border:none;padding:8px 16px;border-radius:8px;font-size:0.75rem;font-weight:600;cursor:pointer;margin-right:8px;">Reload Page</button>
            <button onclick="if(window.navigator && navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(w=>w.unregister()));}localStorage.clear();window.location.reload(true);" style="background:#202c33;color:#94a3b8;border:none;padding:8px 16px;border-radius:8px;font-size:0.75rem;cursor:pointer;">Clear Cache & Refresh</button>
          </div>

          <style>
            @keyframes indet{0%{left:-40%}50%{left:40%;width:50%}100%{left:100%;width:30%}}
          </style>
          
          <script>
            setTimeout(function() {
              var el = document.getElementById('preloader-troubleshoot');
              if (el && document.getElementById('app-preloader')) {
                el.style.display = 'block';
              }
            }, 6000);
          </script>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
